<style>

.kpi.dark{background:var(--ink);border-color:var(--ink);color:#fff}.kpi.dark span{color:#9FB093}.kpi.dark b{color:var(--lime)}.kpi.dark small{color:#B8C4B0}
.up{color:var(--green-d);font-weight:700}.dn{color:var(--red);font-weight:700}

.g2>*,.g3>*{min-width:0}
.legend{display:flex;gap:16px;font-size:.8rem;color:var(--muted);margin-top:8px}

.list{display:grid;gap:2px}

.li:last-child{border:0}

.bd{display:inline-block;font:700 .7rem/1 var(--fb);padding:5px 9px;border-radius:99px;white-space:nowrap}

.chip small{opacity:.65;margin-left:5px}
.search{flex:1;min-width:180px;max-width:320px;margin-left:auto;background:#fff;border:2px solid var(--line);border-radius:999px;padding:0 16px;min-height:40px}
.search:focus{outline:none;border-color:var(--green)}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:640px}
th{text-align:left;font:700 .7rem/1 var(--fb);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 14px;border-bottom:1px solid var(--line);white-space:nowrap}

tr:last-child td{border:0}
td.r,th.r{text-align:right}td.m{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}

tbody tr:hover{background:#FAFBF5}
.kan{display:grid;grid-template-columns:repeat(5,minmax(196px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}

.col>h3{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 10px;font-size:.9rem}

.cc{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid var(--line);position:relative}
.cc.pr{border-left:4px solid #E0A100}
.cc h4{margin:0 30px 2px 0;font:700 .95rem/1.25 var(--fb);overflow-wrap:anywhere}
.cc p{color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}
.cc .star{position:absolute;top:6px;right:4px}

.cc .mv .btn{padding:5px 10px;min-height:32px}
.seg{font-size:.74rem;font-weight:700;padding:3px 8px;border-radius:99px;background:#EEF4DD;color:var(--green-d)}
.seg.late{background:#F6DAD6;color:#8C2A20}.seg.now{background:#FFF1CC;color:#7A5600}
.bars{display:grid;gap:10px}
.bar-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;align-items:center;font-size:.86rem}
.bar-r span{overflow-wrap:anywhere;font-weight:600}.bar-r em{font-style:normal;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bar-r .tr{grid-column:1/-1;background:#ECEDE3;border-radius:8px;height:14px;overflow:hidden}.bar-r .tr i{display:block;height:100%;border-radius:8px;background:var(--green)}
.bar-r .tr i.o{background:#E0A100}
dialog{border:0;border-radius:22px;padding:0;width:min(560px,calc(100% - 24px));max-height:calc(100vh - 24px);box-shadow:0 30px 80px rgba(0,0,0,.4);color:var(--ink)}

dialog form,dialog .dbody{padding:clamp(18px,3vw,28px)}

.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.f{min-width:0}.f.w{grid-column:1/-1}
label,.lb{display:block;font:700 .7rem/1 var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.in{width:100%;min-width:0;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px}
.in:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px rgba(123,179,22,.2)}
.chk{display:flex;gap:10px;align-items:center;min-height:46px;font-weight:600;text-transform:none;letter-spacing:0;font-size:.92rem;color:var(--ink);margin:0}
.chk input{width:20px;height:20px;accent-color:var(--green-d)}
.err{color:#B3261E;font-weight:700;font-size:.85rem;min-height:1.2em;margin-bottom:10px}
.dact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px;align-items:start}
.qlines{display:grid;gap:8px;margin:12px 0}
.ql{display:grid;grid-template-columns:minmax(0,1fr) 62px 84px 36px;gap:8px;align-items:center;background:#F6F7F0;border-radius:12px;padding:8px}
.ql .in{min-height:40px;padding:6px 9px}
.ql .del{background:none;border:0;cursor:pointer;color:var(--red);font-size:1.1rem;min-height:36px;border-radius:8px}
.addln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-bottom:8px}
.doc{background:#fff;border:1px solid var(--line);border-radius:6px;padding:clamp(18px,3vw,34px);box-shadow:0 10px 40px rgba(13,20,16,.12);font-size:.86rem;color:#111}
.doc .hd{display:flex;justify-content:space-between;gap:12px;border-bottom:3px solid var(--green);padding-bottom:14px;margin-bottom:14px;flex-wrap:wrap}
.doc .co{display:flex;gap:10px;align-items:center}.doc .co svg{width:42px;height:42px;flex:none}
.doc .co b{display:block;font:800 1rem/1.1 var(--fd)}.doc .co small{display:block;color:#555;font-size:.72rem;margin-top:3px}
.doc .no{text-align:right}.doc .no b{display:block;font:800 1.05rem var(--fd);color:var(--green-d)}.doc .no small{color:#555}
.doc dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 14px}.doc dt{font-weight:700;color:#555}.doc dd{margin:0}
.doc table{min-width:0;font-size:.82rem}.doc th{background:#F0F3E6;color:#333;padding:9px 8px}.doc td{padding:8px}
.doc .tot{margin:12px 0 0 auto;width:min(260px,100%);display:grid;gap:4px}
.doc .tot div{display:flex;justify-content:space-between}.doc .tot .g{font:800 1.05rem var(--fd);border-top:2px solid #111;padding-top:6px;margin-top:4px}
.doc .nt{margin-top:16px;color:#444;font-size:.78rem;border-top:1px dashed #BBB;padding-top:10px}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.note{background:#FFF7D6;border:2px dashed #D9B93B;border-radius:var(--r);padding:14px 18px;color:#4A3900;font-size:.86rem;margin-top:16px}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,30px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:90;transition:all .3s;max-width:92vw;text-align:center;border:1px solid var(--lime)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}.qwrap{grid-template-columns:1fr}}
@media (max-width:860px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{position:fixed;left:0;top:0;width:270px;transform:translateX(-102%);transition:transform .25s;box-shadow:0 0 60px rgba(0,0,0,.5)}
 .side.on{transform:none}
 .scrim.on{display:block;position:fixed;inset:0;background:rgba(8,12,9,.55);z-index:35}
 .top{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:30}
 .top button{background:transparent;border:1px solid rgba(255,255,255,.3);border-radius:12px;width:46px;height:46px;color:#fff;font-size:1.3rem;cursor:pointer}
 .top b{font:700 1rem var(--fb)}.top small{color:#9FB093}
}
@media (max-width:560px){
 .kpis{gap:8px}.kpi{padding:14px}
 .fg{grid-template-columns:1fr}
 .sum3{grid-template-columns:1fr}
 .fun button{grid-template-columns:92px 1fr 24px}
 .ql{grid-template-columns:minmax(0,1fr) 54px 76px 32px}
 .search{max-width:none;flex-basis:100%;margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
 body{background:#fff}.demo-note,.side,.top,.noprint,.toast,.scrim{display:none!important}
 .app{display:block}.main:focus{outline:none}
.main{padding:0}
 .printing-doc .qform,.printing-doc .ph,.printing-doc .qback{display:none!important}
 .printing-doc .qwrap{display:block}.doc{box-shadow:none;border:0}
 .card,.kpi,.tw{break-inside:avoid}
}

</style>

<body>
<!-- Boceto de propuesta preparado por Kevin Huamán para Imagen y Sonido Publicidad · sistema de gestión de ejemplo con datos inventados -->
<div class="demo-note">Boceto de propuesta preparado por Kevin Huamán para Imagen y Sonido Publicidad · sistema de gestión de ejemplo, con clientes y montos inventados</div>
<div class="top noprint"><button id="burger" aria-label="Abrir menú" aria-expanded="false" aria-controls="side">☰</button><div><b id="topt">Panel</b><br><small>Imagen y Sonido · Sistema</small></div></div>
<div class="app">

      <svg viewBox="0 0 48 48" aria-hidden="true"><defs><radialGradient id="lg" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#E4FF7A"/><stop offset=".55" stop-color="#7BB316"/><stop offset="1" stop-color="#2F5A0A"/></radialGradient></defs><circle cx="24" cy="24" r="21" fill="url(#lg)"/><path d="M9 28c8-9 22-9 30-2" fill="none" stroke="#0D1410" stroke-width="2.6" stroke-linecap="round"/><path d="M12 35c7-6 17-6 24-1" fill="none" stroke="#0D1410" stroke-width="2" stroke-linecap="round" opacity=".6"/><circle cx="17" cy="16" r="3.2" fill="#fff" opacity=".9"/></svg>

<script>
(function(){
'use strict';
var WA='51945906676';
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}

function pad(n){return n<10?'0'+n:''+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
var T=new Date();T.setHours(12,0,0,0);
function ago(n){var d=new Date(T);d.setDate(d.getDate()-n);return iso(d)}
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2],12)}
var MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fd(s){var d=pd(s);return d.getDate()+' '+MES[d.getMonth()]}
function fdy(s){var d=pd(s);return d.getDate()+' '+MES[d.getMonth()]+' '+d.getFullYear()}
function ym(s){return s.slice(0,7)}
function fmt(n){var neg=n<0;n=Math.abs(Math.round(n*100)/100);var p=n.toFixed(2).split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return (neg?'−':'')+'S/ '+p[0]+(p[1]!=='00'?'.'+p[1]:'')}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on')},3600)}
function months(n){var a=[];for(var i=n-1;i>=0;i--){var d=new Date(T.getFullYear(),T.getMonth()-i,1,12);a.push({k:d.getFullYear()+'-'+pad(d.getMonth()+1),l:MES[d.getMonth()]})}return a}
var CURM=ym(iso(T));

/* ---------- datos de ejemplo (todo inventado) ---------- */
var STG=[['nuevo','Nuevo'],['int','Interesado'],['cot','Cotizado'],['cli','Cliente'],['noi','No interesado']];
function stn(k){return STG.filter(function(s){return s[0]===k})[0][1]}
function badge(k){return '<span class="bd st-'+k+'">'+stn(k)+'</span>'}
var C=[
 [1,'Constructora Cumbre Norte','Empresa','Ing. Marco Salas','976 000 101','cli',1,'Rotulado de flota y brochure anual',null],
 [2,'Lácteos Valle Verde','Empresa','Sra. Rocío Díaz','976 000 102','cli',1,'Packaging y etiquetas de quesos',null],
 [3,'Clínica Santa Aurora','Institución','Lic. Karina Vega','976 000 103','cot',1,'Señalética y folletos',0],
 [4,'Hotel Los Pinos','Empresa','Sr. Hugo Paredes','976 000 104','int',1,'Gigantografías y spot de radio',1],

function clOpen(id){
 var c=cli(id),f=sum(I.filter(function(x){return x.c===id&&x.est==='cobrado'}),function(x){return x.m}),qs=Q.filter(function(q){return q.c===id}),d=$('#dlg');
 d.innerHTML='<div class="dbody"><h3>'+esc(c.n)+'</h3><p style="margin-bottom:12px">'+badge(c.st)+' '+(c.pr?'<span class="bd st-int">★ Prioritario</span>':'')+'</p><div class="sum3"><div class="kpi"><span>Facturado</span><b style="font-size:1.2rem">'+fmt(f)+'</b></div><div class="kpi"><span>Cotizaciones</span><b style="font-size:1.2rem">'+qs.length+'</b></div><div class="kpi"><span>Tipo</span><b style="font-size:1.2rem">'+esc(c.tipo)+'</b></div></div><p><b>'+esc(c.ct)+'</b> · '+esc(c.tel)+'</p><p style="color:var(--muted);margin:6px 0 14px">'+esc(c.nota)+'</p>'+(c.seg!=null?'<p style="margin-bottom:14px">'+segTag(c)+'</p>':'')+'<div class="dact" style="justify-content:flex-start"><button class="btn lime" type="button" data-d="quote">Nueva cotización</button>'+(c.seg!=null?'<button class="btn line" type="button" data-d="seg">Seguimiento hecho (+7 días)</button>':'<button class="btn line" type="button" data-d="seg">Programar seguimiento</button>')+'<button class="btn line" type="button" data-d="edit">Editar</button><button class="btn ghost" type="button" data-d="close">Cerrar</button></div></div>';
 d.showModal();
 d.onclick=function(e){var b=e.target.closest('[data-d]');if(e.target===d){d.close();return}if(!b)return;var k=b.getAttribute('data-d');
  if(k==='close')d.close();
  else if(k==='edit'){d.close();clForm(c)}
  else if(k==='seg'){c.seg=7;d.close();render();toast('Seguimiento programado para dentro de 7 días.')}
  else if(k==='quote'){d.close();go('cotizaciones');qNew(id)}
 };
}

/* ---------- cotización: acciones ---------- */
function qNew(cid){S.qe=0;S.qd={id:0,num:nextNum(),c:cid||'',f:iso(T),st:'borrador',igv:true,val:15,nota:'',ing:false,it:[]};render()}
function nextNum(){return Q.reduce(function(m,q){return Math.max(m,q.num)},0)+1}
function qUpdatePrev(){$('#qprev').innerHTML=docHTML(S.qd)}
function qSave(){
 var q=S.qd,er=$('#qerr');
 if(!q.c){er.textContent='Elija un cliente.';return false}
 if(!q.it.length){er.textContent='Agregue al menos un trabajo.';return false}
 if(q.it.some(function(x){return !(x.q>0)||!(x.p>=0)||!x.d})){er.textContent='Revise cantidades, precios y descripciones.';return false}
 er.textContent='';
 q.c=+q.c;var c=cli(q.c),msg='Cotización guardada.';
 if(q.st==='aprobada'&&!q.ing){q.ing=true;c.st='cli';I.push({id:nid(I),c:q.c,con:'Cotización COT-'+q.num+' (50 % de adelanto)',m:Math.round(qtot(q)*50)/100,f:iso(T),pago:'Transferencia',est:'xcobrar'});msg='Aprobada: '+esc(c.n)+' pasó a «Cliente» y se creó un ingreso por cobrar del 50 %.'}
 else if(q.st==='enviada'&&(c.st==='nuevo'||c.st==='int'))c.st='cot';
 if(!q.id){q.id=nid(Q);Q.push(q)}else{Q[Q.map(function(x){return x.id}).indexOf(q.id)]=q}
 toast(msg);return true;
}
function waOpen(m){var a=document.createElement('a');a.href='https://wa.me/'+WA+'?text='+encodeURIComponent(m);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}

/* ---------- eventos ---------- */
var main=$('#view');
main.addEventListener('click',function(e){
 var b=e.target.closest('[data-a]');if(!b)return;var a=b.getAttribute('data-a'),id=+b.getAttribute('data-id'),v=b.getAttribute('data-v');
 switch(a){
  case 'go':go(v);if(b.getAttribute('data-new'))qNew();break;
  case 'stage':S.cs=v;go('clientes');break;
  case 'cv':S.cv=v;render();break;case 'cs':S.cs=v;render();break;case 'cp':S.cp=!S.cp;render();break;
  case 'star':cli(id).pr=!cli(id).pr;render();break;
  case 'mv':var c=cli(id),k=STG.map(function(s){return s[0]}),n=k.indexOf(c.st)+ +b.getAttribute('data-d');c.st=k[n];render();toast(c.n+' → '+stn(c.st));break;
  case 'cl-new':clForm();break;case 'cl-open':clOpen(id);break;
  case 'is':S.is=v;render();break;case 'gc':S.gc=v;render();break;case 'vp':S.vp=v==='true';render();break;case 'rp':S.rp=v;render();break;
  case 'i-new':iForm();break;case 'g-new':gForm();break;case 'v-new':vForm();break;
  case 'i-cob':I.filter(function(x){return x.id===id})[0].est='cobrado';render();toast('Pago marcado como cobrado.');break;
  case 'vstar':prov(id).pr=!prov(id).pr;render();break;
  case 'q-new':qNew();break;
  case 'q-open':S.qd=JSON.parse(JSON.stringify(Q.filter(function(q){return q.id===id})[0]));S.qe=id;render();break;
  case 'q-dup':var o=JSON.parse(JSON.stringify(Q.filter(function(q){return q.id===id})[0]));o.id=0;o.num=nextNum();o.f=iso(T);o.st='borrador';o.ing=false;S.qd=o;S.qe=0;render();toast('Copia lista para editar.');break;
  case 'q-back':S.qe=null;S.qd=null;render();break;
  case 'q-add':var cat=CAT[+$('#q-cat').value];S.qd.it.push({d:cat[0],q:1,p:cat[1]});$('#qlines').innerHTML=qLines(S.qd);qUpdatePrev();break;
  case 'q-custom':S.qd.it.push({d:'Trabajo a medida',q:1,p:0});$('#qlines').innerHTML=qLines(S.qd);qUpdatePrev();break;
  case 'q-del':S.qd.it.splice(id,1);$('#qlines').innerHTML=qLines(S.qd);qUpdatePrev();break;
  case 'q-save':if(qSave()){S.qe=null;S.qd=null;render()}break;
  case 'q-wa':if(!S.qd.c){$('#qerr').textContent='Elija un cliente.';break}var cc=cli(+S.qd.c);waOpen('[DEMO] Hola '+cc.ct+', le envío la cotización COT-'+S.qd.num+' de Imagen y Sonido Publicidad por '+fmt(qtot(S.qd))+' (válida '+S.qd.val+' días). Quedo atento a su respuesta.');toast('Abriendo WhatsApp (número de prueba)…');break;
  case 'q-print':document.body.classList.add('printing-doc');window.print();setTimeout(function(){document.body.classList.remove('printing-doc')},500);break;
  case 'print':window.print();break;
  case 'csv':csv();break;
 }
});
main.addEventListener('input',function(e){
 var t=e.target;
 if(t.id==='csearch'){S.cq=t.value;$('#clres').innerHTML=clRes();return}
 if(t.hasAttribute('data-qf')){var k=t.getAttribute('data-qf');S.qd[k]=t.type==='checkbox'?t.checked:(k==='val'?+t.value:t.value);qUpdatePrev();return}
 if(t.hasAttribute('data-qi')){var it=S.qd.it[+t.getAttribute('data-qi')],kk=t.getAttribute('data-qk');it[kk]=kk==='d'?t.value:parseFloat(t.value)||0;qUpdatePrev()}
});
main.addEventListener('change',function(e){var t=e.target;if(t.getAttribute('data-qf')==='st'||t.getAttribute('data-qf')==='igv'){S.qd[t.getAttribute('data-qf')]=t.type==='checkbox'?t.checked:t.value;qUpdatePrev()}});
function csv(){
 var from=periodFrom(S.rp),rows=[['Tipo','Fecha','Cliente / Proveedor','Concepto','Categoría / Pago','Estado','Monto (S/)']];
 I.filter(function(x){return x.f>=from}).forEach(function(x){rows.push(['Ingreso',x.f,cli(x.c).n,x.con,x.pago,x.est==='cobrado'?'Cobrado':'Por cobrar',x.m])});
 G.filter(function(x){return x.f>=from}).forEach(function(x){rows.push(['Gasto',x.f,x.pv?prov(x.pv).n:'',x.con,x.cat,'Pagado',-x.m])});
 var t='﻿'+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
 var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download='reporte-imagen-y-sonido-'+S.rp+'.csv';document.body.appendChild(a);a.click();a.remove();toast('Reporte descargado (CSV, abre en Excel).');
}

/* ---------- navegación ---------- */
function go(v){location.hash='#/'+v;if(cur===v)render()}
function nav(){
 var n={clientes:C.length,cotizaciones:Q.filter(function(q){return q.st==='enviada'}).length};
 $('#nav').innerHTML=MODS.map(function(m){return '<a href="#/'+m[0]+'"'+(cur===m[0]?' aria-current="page"':'')+'>'+ic(m[0])+m[1]+(n[m[0]]?'<span class="n">'+n[m[0]]+'</span>':'')+'</a>'}).join('');
}
function render(){
 var y=window.scrollY;
 main.innerHTML=VIEW[cur]();nav();
 $('#topt').textContent=MODS.filter(function(m){return m[0]===cur})[0][1];
 document.title='Boceto Imagen y Sonido · '+$('#topt').textContent;
 closeSide();
}
function route(){
 var h=(location.hash||'#/panel').replace(/^#\/?/,'').split('/')[0];
 if(!VIEW[h])h='panel';
 if(h!==cur){cur=h;if(cur!=='cotizaciones'){S.qe=null;S.qd=null}render();window.scrollTo(0,0);main.focus({preventScroll:true})}
}
window.addEventListener('hashchange',route);
function openSide(){$('#side').classList.add('on');$('#scrim').classList.add('on');$('#burger').setAttribute('aria-expanded','true')}
function closeSide(){$('#side').classList.remove('on');$('#scrim').classList.remove('on');$('#burger').setAttribute('aria-expanded','false')}
$('#burger').addEventListener('click',function(){$('#side').classList.contains('on')?closeSide():openSide()});
$('#scrim').addEventListener('click',closeSide);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSide()});
(function(){var h=(location.hash||'#/panel').replace(/^#\/?/,'').split('/')[0];cur=VIEW[h]?h:'panel';render()})();
})();

</script>
</body>
