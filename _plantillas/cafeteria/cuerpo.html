<a class="wa-float" data-wa="Quisiera información." href="#" aria-label="Escribir por WhatsApp"><svg viewBox="0 0 32 32"><path d="M16 3C9 3 3.4 8.6 3.4 15.6c0 2.3.6 4.4 1.7 6.3L3 29l7.3-2c1.8 1 3.8 1.5 5.8 1.5 7 0 12.6-5.6 12.6-12.6S23 3 16 3zm0 23c-1.9 0-3.7-.5-5.2-1.5l-.4-.2-4.3 1.2 1.2-4.2-.3-.4a10.2 10.2 0 01-1.6-5.5C5.4 9.8 10.2 5.2 16 5.2S26.6 9.8 26.6 15.5 21.8 26 16 26zm5.8-7.700c-.3-.2-1.900-.9-2.200-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.200-.2.2-.4.2-.7.1-.3-.2-1.400-.5-2.600-1.600-1-.9-1.600-1.900-1.800-2.200-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.3.3-.5.1-.2.1-.4 0-.6-.1-.2-.7-1.700-1-2.300-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.200 1.200-1.200 2.800s1.200 3.300 1.400 3.500c.2.2 2.400 3.700 5.800 5.100.8.4 1.500.6 2 .8.8.3 1.600.2 2.200.1.7-.1 1.900-.8 2.200-1.500.3-.7.3-1.400.2-1.500-.1-.1-.3-.2-.6-.4z"/></svg></a>

<script>
var CONFIG=/*__CONFIG__*/;
(function(){
  var C=CONFIG,WA=C.wa;
  var $=function(s,c){return (c||document).querySelector(s)};
  var $$=function(s,c){return Array.prototype.slice.call((c||document).querySelectorAll(s))};
  function saludo(){var h=new Date().getHours();return h<12?"Buenos días":(h<19?"Buenas tardes":"Buenas noches")}
  function wa(msg){return "https://wa.me/"+WA+"?text="+encodeURIComponent(saludo()+", "+msg)}
  function soles(n){return "S/ "+n.toLocaleString("es-PE",{minimumFractionDigits:(n%1?2:0),maximumFractionDigits:2})}
  function iso(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd}
  function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x}
  function fechaTxt(s){var p=s.split("-"),m=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];return parseInt(p[2],10)+" "+m[parseInt(p[1],10)-1]}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  var HOY=new Date();
  var ICON={
    cup:'<path d="M4 9h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5zM17 10h2a2 2 0 010 4h-2M7 3v3M11 3v3"/>',
    ice:'<path d="M6 8h12l-1.500 12h-9zM8 4h8l1 4M12 4v4"/>',
    food:'<path d="M4 12h16a8 8 0 01-16 0zM8 8c0-2 2-2 2-4M13 8c0-2 2-2 2-4"/>',
    cake:'<path d="M4 20h16v-7H4zM6 13c0-2 2-3 2-3s2 1 2 3M12 13c0-2 2-3 2-3s2 1 2 3M12 10V6M12 4v1"/>',
    flask:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 002 3h10a2 2 0 002-3l-5-9V3M8 15h8"/>',
    press:'<path d="M7 5h10v14a2 2 0 01-2 2H9a2 2 0 01-2-2zM12 2v6M9 8h6"/>',
    drip:'<path d="M5 4h14l-4 8v6H9v-6zM12 18v3M8 21h8"/>',
    mach:'<rect x="4" y="3" width="16" height="12" rx="2"/><path d="M8 15v4h8v-4M8 9h8"/>',
    music:'<path d="M9 18V6l10-2v12M9 18a3 3 0 11-3-3 3 3 0 013 3zm10-2a3 3 0 11-3-3 3 3 0 013 3z"/>',
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
    key:'<circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v3M21 12v2"/>',
    img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M3 17l5-4 4 3 3-2 6 4"/>',
    bag:'<path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 016 0v2"/>',
    heart:'<path d="M12 21s-7-4.400-7-10a4 4 0 017-2.600A4 4 0 0119 11c0 5.600-7 10-7 10z"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    seed:'<path d="M12 3c4 3 6 7 4 12-1.500 3-4 5-4 6-0-1-2.500-3-4-6-2-5 0-9 4-12zM12 6v14"/>'
  };
  function ic(n){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(ICON[n]||ICON.img)+'</svg>'}

  /* ----- Tema, textos y logo ----- */
  function applyTema(v){
    var all=Object.keys((C.tema||{}).v1||{}).concat(Object.keys((C.tema||{}).v2||{}));
    all.forEach(function(k){document.body.style.removeProperty(k)});
    var t=(C.tema||{})["v"+v]||{};Object.keys(t).forEach(function(k){document.body.style.setProperty(k,t[k])});
  }
  $$("[data-nombre]").forEach(function(e){e.textContent=C.nombre});
  $$("[data-ciudad]").forEach(function(e){e.textContent=C.ciudad+" · "+C.region});
  $$("[data-dir]").forEach(function(e){e.textContent=C.direccion});
  $$("[data-mk]").forEach(function(e){if(C.logo){var i=document.createElement("img");i.src=C.logo;i.alt="Logo "+C.nombre;e.appendChild(i)}else e.textContent=C.inicial});
  $("#n1").textContent=C.vista1;$("#n2").textContent=C.vista2;
  $("#eb1").textContent=C.nombre+" · "+C.ubicacionCorta;
  $("#h1t").innerHTML=C.titular1;$("#lead1").textContent=C.lead1;
  $("#gn1").textContent=C.google.nota;$("#gt1").textContent=C.google.n+" reseñas en Google Maps";
  $("#h2t").innerHTML=C.titular2;$("#lead2").textContent=C.lead2;
  var statsH=C.stats.map(function(s){return '<div><b>'+s[0]+'</b><span>'+s[1]+'</span></div>'}).join("");
  $("#stats1").innerHTML=statsH;$("#stats2").innerHTML=statsH;
  $$("[data-wa]").forEach(function(a){a.href=wa(a.getAttribute("data-wa"));a.target="_blank";a.rel="noopener"});

  var curView="1";
  function setView(v){
    curView=v;document.body.setAttribute("data-view",v);applyTema(v);
    $("#v1").hidden=(v!=="1");$("#v2").hidden=(v!=="2");
    $$(".vsel button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.v===v?"true":"false")});
    if(history.replaceState)history.replaceState(null,"",v==="2"?"#vista2":"#vista1");
    window.scrollTo(0,0);
  }
  $$(".vsel button").forEach(function(b){b.addEventListener("click",function(){setView(b.dataset.v)})});

  /* ----- Datos de carta ----- */
  var ALL=[];C.carta.forEach(function(c){c.items.forEach(function(i){i.cat=c.n;ALL.push(i)})});
  function item(id){return ALL.filter(function(i){return i.id===id})[0]}
  var CART={},MODE="llevar",HORA="ya";

  /* ----- Buscador de café ----- */
  var QZ={s:C.sabores[0].k,i:"media",t:"caliente",l:"da igual"};
  function score(it){
    if(!it.tags)return -1;var sc=0,g=it.tags;
    if(g.s.indexOf(QZ.s)>=0)sc+=3;
    if(g.i===QZ.i)sc+=2;else if((g.i==="media")||(QZ.i==="media"))sc+=1;
    if(g.t===QZ.t)sc+=3;else sc-=3;
    if(QZ.l==="con leche"){if(g.l)sc+=2}else if(QZ.l==="sin leche"){if(!g.l)sc+=2;else sc-=2}
    return sc;
  }
  function pills(name,key,opts){
    return '<div class="grp"><span class="l">'+name+'</span><div class="pills" data-k="'+key+'">'+opts.map(function(o){return '<button type="button" data-v="'+esc(o[0])+'" aria-pressed="'+(QZ[key]===o[0]?"true":"false")+'">'+o[1]+'</button>'}).join("")+'</div></div>';
  }
  function finderHTML(p,conSabor){
    var h='';
    if(conSabor)h+='<h2>Encuentre su café ideal</h2><p style="margin:0;color:var(--mut);font-size:.92rem">Elija cómo le gusta y la carta le recomienda una bebida.</p>'+pills("Sabor que busca","s",C.sabores.map(function(x){return [x.k,x.n]}));
    else h+='<h2 id="sabT'+p+'">Su sabor: <span style="color:var(--acc)">'+C.sabores.filter(function(x){return x.k===QZ.s})[0].n+'</span></h2><p style="margin:0;color:var(--mut);font-size:.92rem">Toque un sabor de la rueda y ajuste lo demás.</p>';
    h+=pills("Intensidad","i",[["suave","Suave"],["media","Media"],["fuerte","Fuerte"]]);
    h+=pills("Temperatura","t",[["caliente","Caliente"],["frio","Frío"]]);
    h+=pills("Con leche","l",[["da igual","Da igual"],["con leche","Con leche"],["sin leche","Sin leche"]]);
    h+='<div class="result" id="res'+p+'" aria-live="polite"></div>';
    return h;
  }
  function drawResult(){
    var arr=ALL.filter(function(i){return i.tags}).map(function(i){return [i,score(i)]}).sort(function(a,b){return b[1]-a[1]});
    var top=arr[0][0],alt=arr.slice(1,3).map(function(x){return x[0].n});
    ["1","2"].forEach(function(p){
      var box=$("#res"+p);if(!box)return;
      var sb=C.sabores.filter(function(x){return x.k===QZ.s})[0];
      box.innerHTML='<span class="eyebrow" style="margin:0">Le recomendamos</span><div class="nm">'+esc(top.n)+'</div><p>'+esc(top.d)+'</p><p>Notas de <b>'+sb.n.toLowerCase()+'</b> · '+(top.tags.t==="frio"?"frío":"caliente")+' · intensidad '+top.tags.i+'</p><div class="row"><span class="pr">'+soles(top.p)+'</span><span class="ej">precio de ejemplo</span><button type="button" class="btn sm" data-add="'+top.id+'">Agregar a mi pedido</button></div><div class="alt">También podría gustarle: '+alt.join(" · ")+'</div>';
      var b=box.querySelector("[data-add]");b.addEventListener("click",function(){add(top.id);var t=$("#carta"+p);t.scrollIntoView({behavior:"smooth"})});
    });
    $$(".wheel path").forEach(function(pa){pa.setAttribute("opacity",pa.dataset.k===QZ.s?1:.5);pa.setAttribute("aria-pressed",pa.dataset.k===QZ.s?"true":"false")});
    var t=$("#sabT2");if(t)t.innerHTML='Su sabor: <span style="color:var(--acc)">'+C.sabores.filter(function(x){return x.k===QZ.s})[0].n+'</span>';
  }
  function bindFinder(root){
    $$(".pills",root).forEach(function(g){
      $$("button",g).forEach(function(b){b.addEventListener("click",function(){QZ[g.dataset.k]=b.dataset.v;syncPills();drawResult()})});
    });
  }
  function syncPills(){
    $$(".pills").forEach(function(g){$$("button",g).forEach(function(b){b.setAttribute("aria-pressed",QZ[g.dataset.k]===b.dataset.v?"true":"false")})});
  }
  $("#finder1").innerHTML=finderHTML("1",true);bindFinder($("#finder1"));
  $("#finder2").innerHTML=finderHTML("2",false);bindFinder($("#finder2"));
  (function wheel(){
    var w=$("#wheel"),NS="http://www.w3.org/2000/svg",n=C.sabores.length,cx=150,cy=150,R=140,r=46;
    function P(rad,a){return [cx+rad*Math.cos(a),cy+rad*Math.sin(a)]}
    C.sabores.forEach(function(s,i){
      var a1=(i/n)*2*Math.PI-Math.PI/2,a2=((i+1)/n)*2*Math.PI-Math.PI/2;
      var p1=P(R,a1),p2=P(R,a2),p3=P(r,a2),p4=P(r,a1);
      var pa=document.createElementNS(NS,"path");
      pa.setAttribute("d","M"+p1[0]+" "+p1[1]+" A"+R+" "+R+" 0 0 1 "+p2[0]+" "+p2[1]+" L"+p3[0]+" "+p3[1]+" A"+r+" "+r+" 0 0 0 "+p4[0]+" "+p4[1]+"Z");
      pa.setAttribute("fill",s.c);pa.dataset.k=s.k;pa.setAttribute("tabindex","0");pa.setAttribute("role","button");pa.setAttribute("aria-label","Sabor "+s.n);
      function go(){QZ.s=s.k;syncPills();drawResult()}
      pa.addEventListener("click",go);pa.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}});
      w.appendChild(pa);
      var m=P((R+r)/2,(a1+a2)/2),t=document.createElementNS(NS,"text");
      t.setAttribute("x",m[0]);t.setAttribute("y",m[1]+4);t.setAttribute("text-anchor","middle");t.textContent=s.n;w.appendChild(t);
    });
    var c=document.createElementNS(NS,"circle");c.setAttribute("cx",cx);c.setAttribute("cy",cy);c.setAttribute("r",r-6);c.setAttribute("class","ctr");w.appendChild(c);
    var tt=document.createElementNS(NS,"text");tt.setAttribute("x",cx);tt.setAttribute("y",cy-2);tt.setAttribute("text-anchor","middle");tt.setAttribute("class","ctrt");tt.textContent="Rueda de";w.appendChild(tt);
    var t2=document.createElementNS(NS,"text");t2.setAttribute("x",cx);t2.setAttribute("y",cy+11);t2.setAttribute("text-anchor","middle");t2.setAttribute("class","ctrt");t2.textContent="sabores";w.appendChild(t2);
  })();

  /* ----- Carrito ----- */
  function add(id){CART[id]=(CART[id]||0)+1;refresh()}
  function cartData(){var l=[],t=0;ALL.forEach(function(i){if(CART[i.id]){l.push([i,CART[i.id]]);t+=i.p*CART[i.id]}});return {l:l,t:t}}
  var CATSEL={"1":0,"2":0};
  function drawItems(p){
    var cat=C.carta[CATSEL[p]];
    $$("#tb"+p+" button").forEach(function(b,i){b.setAttribute("aria-pressed",i===CATSEL[p]?"true":"false")});
    $("#it"+p).innerHTML=cat.items.map(function(i){var q=CART[i.id]||0;
      return '<div class="it"><div class="tx"><b>'+esc(i.n)+(i.real?' <span class="ok">dato público</span>':'')+'</b><small>'+esc(i.d)+'</small>'+(i.tags?'<div style="margin-top:.3rem">'+i.tags.s.map(function(s){return '<span class="tg">'+s+'</span>'}).join("")+'</div>':'')+'</div><div class="p">'+soles(i.p)+'</div><div class="qty">'+(q?'<button type="button" data-m="'+i.id+'" aria-label="Quitar uno">−</button><span>'+q+'</span><button type="button" data-a="'+i.id+'" aria-label="Agregar uno">+</button>':'<button type="button" class="add" data-a="'+i.id+'">Agregar</button>')+'</div></div>'}).join("");
    $$("[data-a]",$("#it"+p)).forEach(function(b){b.addEventListener("click",function(){add(b.dataset.a)})});
    $$("[data-m]",$("#it"+p)).forEach(function(b){b.addEventListener("click",function(){var k=b.dataset.m;CART[k]=(CART[k]||0)-1;if(CART[k]<=0)delete CART[k];refresh()})});
  }
  function drawCart(){
    var d=cartData();
    ["1","2"].forEach(function(p){
      var box=$("#cb"+p);if(!box)return;
      var nom=box.querySelector("input")?box.querySelector("input").value:"";
      var notas=box.querySelector("textarea")?box.querySelector("textarea").value:"";
      box.innerHTML='<h3>Su pedido</h3><div class="modes" role="group" aria-label="Cómo lo quiere"><button type="button" data-mode="llevar" aria-pressed="'+(MODE==="llevar")+'">Para llevar</button><button type="button" data-mode="local" aria-pressed="'+(MODE==="local")+'">Lo tomo en el local</button></div>'+(d.l.length?'<ul>'+d.l.map(function(x){return '<li><span>'+x[1]+' × '+esc(x[0].n)+'</span><b>'+soles(x[0].p*x[1])+'</b></li>'}).join("")+'</ul><div class="tt"><span>Total referencial</span><b>'+soles(d.t)+'</b></div>':'<p class="mut" style="margin:0 0 .8rem">Aún no agregó nada. Elija de la carta o use el buscador de café.</p>')+'<div class="fld"><label for="pn'+p+'">A nombre de</label><input id="pn'+p+'" autocomplete="name" value="'+esc(nom)+'"></div>'+(MODE==="llevar"?'<div class="fld"><label for="ph'+p+'">Hora de recojo</label><select id="ph'+p+'">'+C.recojo.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===HORA?' selected':'')+'>'+o[1]+'</option>'}).join("")+'</select></div>':'')+'<div class="fld"><label for="pt'+p+'">Notas (opcional)</label><textarea id="pt'+p+'" rows="2" placeholder="Sin azúcar, leche deslactosada...">'+esc(notas)+'</textarea></div><button class="btn" type="button" id="cs'+p+'"'+(d.l.length?'':' disabled')+'>Enviar pedido por WhatsApp</button><p class="mut" style="margin:.7rem 0 0;font-size:.76rem">Precios de ejemplo. El local confirma el tiempo de preparación.</p>';
      $$("[data-mode]",box).forEach(function(b){b.addEventListener("click",function(){MODE=b.dataset.mode;drawCart()})});
      var sel=$("#ph"+p);if(sel)sel.addEventListener("change",function(){HORA=sel.value;drawCart()});
      $("#cs"+p).addEventListener("click",function(){
        var n=$("#pn"+p).value.trim(),t=$("#pt"+p).value.trim();
        var rh=C.recojo.filter(function(o){return o[0]===HORA})[0];
        var m="quisiera hacer un pedido "+(MODE==="llevar"?"para llevar":"para tomar en el local")+(n?" a nombre de "+n:"")+":\n"+d.l.map(function(x){return "• "+x[1]+" × "+x[0].n}).join("\n")+"\nTotal referencial: "+soles(d.t)+"."+(MODE==="llevar"&&rh?"\nRecojo: "+rh[1].toLowerCase()+".":"")+(t?"\nNotas: "+t:"");
        window.open(wa(m),"_blank","noopener");
      });
    });
  }
  function refresh(){drawItems("1");drawItems("2");drawCart()}

  /* ----- Secciones compartidas ----- */
  function shared(p){
    var h="";
    h+='<section class="sec band" id="carta'+p+'"><div class="wrap"><div class="head"><div class="eyebrow">Carta digital</div><h2>Pida para llevar o reserve su café en el local</h2><p>Agregue lo que desea, elija si lo recoge o lo toma en el local y el pedido llega ordenado por WhatsApp. <span class="ej">carta y precios de ejemplo</span></p></div><div class="menu"><div><div class="tabs" id="tb'+p+'"></div><div class="items" id="it'+p+'"></div></div><div class="cartbox" id="cb'+p+'"></div></div></div></section>';

    C.carta.forEach(function(c,i){var b=document.createElement("button");b.type="button";b.textContent=c.n;b.addEventListener("click",function(){CATSEL[p]=i;drawItems(p)});tb.appendChild(b)});
